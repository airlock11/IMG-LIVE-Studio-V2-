name: IMG V2 Stable-Signed Update APK
on:
  workflow_dispatch:
    inputs:
      test_channel:
        description: "Sign the isolated .test package (true) or the main V2 package (false)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
permissions:
  contents: read
jobs:
  signed-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMG_V2_KEYSTORE_BASE64: ${{ secrets.IMG_V2_KEYSTORE_BASE64 }}
      IMG_V2_STORE_PASSWORD: ${{ secrets.IMG_V2_STORE_PASSWORD }}
      IMG_V2_KEY_ALIAS: ${{ secrets.IMG_V2_KEY_ALIAS }}
      IMG_V2_KEY_PASSWORD: ${{ secrets.IMG_V2_KEY_PASSWORD }}
      IMG_V2_KEYSTORE_PATH: /tmp/img-v2-stable-signing.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Require persistent private signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IMG_V2_KEYSTORE_BASE64" ] || [ -z "$IMG_V2_STORE_PASSWORD" ] || [ -z "$IMG_V2_KEY_ALIAS" ] || [ -z "$IMG_V2_KEY_PASSWORD" ]; then
            echo "::error::Stable signing secrets are not configured. Refusing to distribute a falsely update-compatible APK."
            exit 1
          fi
          umask 077
          printf '%s' "$IMG_V2_KEYSTORE_BASE64" | base64 --decode > "$IMG_V2_KEYSTORE_PATH"
          test -s "$IMG_V2_KEYSTORE_PATH"
      - name: Compile signed V2 release APK
        run: |
          gradle :app:assembleRelease \
            -PimgSideBySideTest=${{ inputs.test_channel }} \
            -PimgOAuthBackendUrl=https://img-live-studio-oauth.magsipocarnie.workers.dev \
            --stacktrace
      - name: Verify package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep "^package: name='com.imgofficial.livestudio.v2"
      - uses: actions/upload-artifact@v4
        with:
          name: IMG-V2-STABLE-SIGNED-UPDATE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$IMG_V2_KEYSTORE_PATH"
