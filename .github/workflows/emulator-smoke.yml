name: IMG V2 Android Emulator Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/emulator-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push must not cancel an emulator boot already in progress.
    # Run checks per commit SHA so each APK can reach a conclusive result.
    concurrency:
      group: img-v2-emulator-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate OAuth backend and account UI JavaScript
        run: |
          node --check backend/oauth-worker/src/index.js
          node --check app/src/main/assets/account-connections.js
      - name: Assemble debug APK and real graphics instrumentation tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and inspect actual app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.imgofficial.livestudio.v2.test/androidx.test.runner.AndroidJUnitRunner > img-v2-graphics-tests.txt
            cat img-v2-graphics-tests.txt
            grep -q '^OK (' img-v2-graphics-tests.txt
            adb pull /sdcard/Android/data/com.imgofficial.livestudio.v2/files/img-v2-native-graphics.png img-v2-native-graphics.png
            adb shell am start -n com.imgofficial.livestudio.v2/.MainActivity
            sleep 18
            adb shell pidof com.imgofficial.livestudio.v2
            adb shell dumpsys activity activities | grep -F 'com.imgofficial.livestudio.v2'
            adb logcat -d -t 2500 > img-v2-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com.imgofficial.livestudio.v2' img-v2-logcat.txt; then exit 1; fi
            adb shell screencap -p /sdcard/img-v2.png
            adb pull /sdcard/img-v2.png img-v2-emulator.png
            # The native broadcast Activity is intentionally NOT exported.
            # ADB shell may not open it directly; doing so causes a security
            # exception (exit 255). Keep private stream launch protected.
            # UI hierarchy capture can be OOM-killed (exit 137) on hosted emulators.
            # Keep app launch/crash checks mandatory; make optional evidence best-effort.
            timeout 20s adb shell uiautomator dump /sdcard/img-v2-ui.xml || true
            timeout 10s adb pull /sdcard/img-v2-ui.xml img-v2-ui.xml || true
      - name: Upload actual emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMG-V2-Actual-Emulator
          path: |
            img-v2-emulator.png
            img-v2-graphics-tests.txt
            img-v2-native-graphics.png
            img-v2-ui.xml
            img-v2-logcat.txt
