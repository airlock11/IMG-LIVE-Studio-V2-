name: IMG V2 Cloudflare OAuth Deployment Smoke
on:
  push:
    paths:
      - 'backend/oauth-worker/**'
      - '.github/workflows/cloudflare-oauth-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: img-v2-cloudflare-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-staging-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V2 test-only YouTube mode or fail-closed disabled state
        env:
          IMG_V2_OAUTH_URL: https://img-live-studio-oauth.magsipocarnie.workers.dev
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.IMG_V2_OAUTH_URL;
          const get=async(path,options={})=>{
            let response;
            for(let i=0;i<4;i++){
              try {response=await fetch(base+path,{...options,signal:AbortSignal.timeout(12000)});break;}
              catch(error){if(i===3)throw error;await new Promise(resolve=>setTimeout(resolve,3000));}
            }
            assert.equal(response.headers.get('cache-control'),'no-store');
            return {status:response.status,data:await response.json()};
          };
          const health=await get('/health');
          const mode=health.data.mode||(health.status===503?'disabled':'full');
          assert.notEqual(mode,'full','Unexpected production OAuth enabled');
          if(mode==='youtube_testing'){
            assert.equal(health.data.providers?.facebook,false,'Facebook must remain disabled');
            assert.equal(health.status,200);
            assert.equal(health.data.configured,true);
            assert.equal(health.data.providers.youtube,true);
            const connections=await get('/api/connections');
            assert.equal(connections.status,200);
            assert.equal(connections.data.youtube.connected,false);
            assert.equal(connections.data.facebook.connected,false);
            const readiness=await get('/api/connections/youtube/live-readiness',{
              headers:{Origin:'https://appassets.androidplatform.net'}
            });
            assert.equal(readiness.status,401,'Readiness must not be available without a native session');
            assert.equal(readiness.data.error,'not_authenticated');
            const draft=await get('/api/connections/youtube/private-draft',{
              method:'POST',headers:{Origin:'https://appassets.androidplatform.net','Content-Type':'application/json'},body:'{}'
            });
            assert.ok(draft.status===401||draft.status===503,'Private draft must require a trusted authenticated native session');
            assert.ok(['not_authenticated','private_drafts_disabled'].includes(draft.data.error));
            const forgedDraft=await get('/api/connections/youtube/private-draft',{
              method:'POST',headers:{Origin:'https://attacker.example','Content-Type':'application/json'},body:'{}'
            });
            assert.equal(forgedDraft.status,403,'Cross-origin private draft creation must be denied');
            assert.equal(forgedDraft.data.error,'forbidden_origin');

            const facebook=await get('/api/connections/facebook/authorize',{
              method:'POST',headers:{Origin:'https://appassets.androidplatform.net','Content-Type':'application/json'},body:'{}'
            });
            assert.equal(facebook.status,503);
            assert.equal(facebook.data.error,'provider_not_enabled');
            const hostile=await get('/api/connections/youtube/authorize',{
              method:'POST',headers:{Origin:'https://attacker.example','Content-Type':'application/json'},body:'{}'
            });
            assert.equal(hostile.status,403);
            console.log('YouTube-only OAuth test window verified; Facebook denied');
          }else{
            assert.equal(mode,'disabled');
            assert.equal(health.status,503);
            const connections=await get('/api/connections');
            assert.equal(connections.status,503);
            assert.equal(connections.data.error,'oauth_not_enabled');
            console.log('OAuth test window is closed, all account routes disabled');
          }
          NODE
