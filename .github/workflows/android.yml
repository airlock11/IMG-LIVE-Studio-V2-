name: IMG V2 Android APK
on:
 push:
  paths:
   - 'app/**'
   - 'build.gradle.kts'
   - 'settings.gradle.kts'
   - 'gradle/**'
   - '.github/workflows/android.yml'
 workflow_dispatch:
jobs:
 apk:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Validate OAuth backend and account UI JavaScript
     run: |
       node --check backend/oauth-worker/src/index.js
       node --check app/src/main/assets/account-connections.js
   - name: Verify preinstalled Android SDK
     run: test -d "$ANDROID_HOME/platforms" && test -d "$ANDROID_HOME/build-tools"
   - name: Install Gradle
     uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - run: gradle :app:assembleDebug --stacktrace
   - uses: actions/upload-artifact@v4
     with:
      name: IMG-LIVE-Studio-V2-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
